stages:
  - test
  - secret-detection
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/front
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  SECRET_DETECTION_ENABLED: 'true'

# ─── SAST ───────────────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

# ─── TEST NUXT ──────────────────────────────────────────
test:nuxt:
  stage: test
  image: node@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920
  script:
    - cd src && npm ci && npm run build
  rules:
    - if: $CI_COMMIT_BRANCH

# ─── BUILD ──────────────────────────────────────────────
build:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f Dockerfile.prod -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - rwd-test-shell

# ─── DEPLOY STAGING ─────────────────────────────────────
deploy:staging:
  stage: deploy
  environment:
    name: staging
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:latest
    - |
      cat > /srv/cocoon-signature/front/.env << EOF
      NUXT_API_URL=$NUXT_API_URL
      NODE_ENV=staging
      EOF
    - docker compose -f /srv/cocoon-signature/front/docker-compose.yml up -d --force-recreate
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  tags:
    - rwd-test-shell

# ─── DEPLOY PROD ────────────────────────────────────────
deploy:prod:
  stage: deploy
  environment:
    name: production
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:latest
    - |
      cat > /srv/cocoon-signature/front/.env << EOF
      NUXT_API_URL=$NUXT_API_URL
      NODE_ENV=production
      EOF
    - docker compose -f /srv/cocoon-signature/front/docker-compose.yml up -d --force-recreate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  tags:
    - rwd-prod-01-shell
